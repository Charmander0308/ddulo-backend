# 로컬 개발 환경 설정

# MySQL DB 설정(docker 사용 가정)
spring.datasource.url=jdbc:mysql://localhost:3306/ddulo?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# Redis Configuration (캐시/버퍼 설정)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PWD}

# ORM 설정 (JPA / Hibernate Configuration)
# 스키마 자동 생성 (개발 시 update, 운영 시 validate or none)
spring.jpa.hibernate.ddl-auto=update
# SQL 로그 포맷팅(가독성)
spring.jpa.properties.hibernate.format_sql=true
# 실제로 실행되는 SQL 로그 출력(운영 시엔 false)
spring.jpa.show-sql=true

# 초기 sql 데이터 로딩
spring.sql.init.mode=never
